<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "Giulio Golinelli" }}</title>
<script>
MathJax = {
  tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
/* The ONLY css on the site — low-frills, inherited from the original homepage + nav */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 0; }
h1 { margin: 0 0 0.35em; }
img { max-width: 100%; height: auto; }

/* ── sticky header (never goes away) ── */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: #fff; border-bottom: 1px solid #ddd;
  padding: 0.5em 0;
}
.site-header-inner {
  max-width: 760px; margin: 0 auto; padding: 0 1.25em;
  display: flex; justify-content: space-between; align-items: center;
}
.site-header h1 { margin: 0; font-size: 1.1em; }
.site-header h1 a { text-decoration: none; color: inherit; }

/* ── nav bar (top right: Home, Blog) ── */
.navbar a {
  font-weight: bold; padding: 8px 16px;
  text-decoration: none; color: inherit; border-radius: 4px;
  font-size: 0.95em;
}
.navbar a:hover { background: #2563eb; color: #fff; }

/* ── content container (same 760px centering as the old table) ── */
.content { max-width: 760px; margin: 0 auto; padding: 1em 1.25em; }

/* ── portrait (from the homepage) ── */
.portrait { float: left; width: 210px; max-width: 100%; margin: 0 1.1em 0.5em 0; }
.portrait img { display: block; width: 100%; height: auto; }
.caption { font-size: 0.78em; line-height: 1.35; margin: 0.4em 0 0; }

/* ── blog figures ── */
figure { margin: 1.5em auto; text-align: center; max-width: 85%; }
figcaption { font-size: 0.82em; color: #666; font-style: italic; margin-top: 0.5em; }

/* ── code blocks ── */
pre { background: #f5f5f5; border: 1px solid #ddd; padding: 0.8em; overflow-x: auto; font-size: 0.85em; }
code { background: #f5f5f5; padding: 1px 4px; border-radius: 3px; }
pre code { background: none; padding: 0; }

/* ── responsive ── */
@media (max-width: 560px) {
  .portrait { float: none; margin: 0 0 0.9em 0; }
  .site-header-inner { flex-direction: column; gap: 0.3em; }
}
</style>
</head>
<body>

<div class="site-header">
  <div class="site-header-inner">
    <h1><a href="/">Giulio Golinelli &mdash; giuliocsr</a></h1>
    <nav class="navbar">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
    </nav>
  </div>
</div>

<div class="content">
{{ content }}
</div>

</body>
</html>
